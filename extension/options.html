<!doctype html>
<html><head><meta charset="utf-8" /><title>Grab settings</title>
<style>
  body{background:#0a0a0c;color:#f4f4f6;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    max-width:520px;margin:48px auto;padding:0 20px}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#8e8e9e;font-size:13px;margin:0 0 24px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#8e8e9e;margin:18px 0 6px}
  input{width:100%;padding:12px 14px;background:#1c1c23;border:1px solid #2b2b35;border-radius:10px;
    color:#f4f4f6;font:14px inherit;outline:none}
  input:focus{border-color:#ff2d55}
  button{margin-top:20px;padding:12px 22px;border:0;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#ff2d55,#ff7a45);color:#fff;font:700 14px inherit}
  .hint{font-size:12px;color:#5c5c6b;margin-top:6px}
  #saved{color:#32d583;font-size:13px;margin-left:12px;opacity:0;transition:opacity .2s}
  #saved.on{opacity:1}
</style></head>
<body>
  <h1>Grab settings</h1>
  <p>Point the extension at your own Grab server.</p>
  <label for="server">Server URL</label>
  <input id="server" type="url" placeholder="http://localhost:8000" />
  <div class="hint">http://localhost:8000 when running ./run.sh on this Mac, or your Railway URL.</div>
  <label for="code">Access code (optional)</label>
  <input id="code" type="text" placeholder="Only if you set ACCESS_CODE on the server" />
  <button id="save">Save</button><span id="saved">Saved ✓</span>
  <script src="options.js"></script>
</body></html>
